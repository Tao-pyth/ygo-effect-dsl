name: Build Windows exe

on:
  pull_request:
  push:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install package and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[analytics,desktop]"
          python -m pip install pytest pyinstaller

      - name: Run pytest
        run: python -m pytest

      - name: Dry-run production distribution gate
        run: >
          python -m ygo_effect_dsl production-distribution-gate
          --repo-root .
          --evidence-dir docs/release/evidence
          --out production-distribution-gate-dry-run.json
          --allow-failed

      - name: Verify installed package version
        run: >
          python -c "from importlib.metadata import version;
          import ygo_effect_dsl;
          assert version('ygo-effect-dsl') == ygo_effect_dsl.__version__"

      - name: Build CLI executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --name ygo-effect-dsl
          --add-data "resources;resources"
          --add-data "src/ygo_effect_dsl/resources;ygo_effect_dsl/resources"
          --hidden-import ygo_effect_dsl.resources
          src/ygo_effect_dsl/__main__.py

      - name: Build desktop GUI executable
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ygo-effect-dsl-desktop
          --add-data "src/ygo_effect_dsl/resources;ygo_effect_dsl/resources"
          --add-data "src/ygo_effect_dsl/desktop/static;ygo_effect_dsl/desktop/static"
          --hidden-import ygo_effect_dsl.resources
          --hidden-import webview.platforms.edgechromium
          src/ygo_effect_dsl/desktop/shell.py

      - name: Verify executable artifacts exist
        run: |
          if (!(Test-Path "dist/ygo-effect-dsl.exe")) {
            throw "dist/ygo-effect-dsl.exe was not created"
          }
          if (!(Test-Path "dist/ygo-effect-dsl-desktop.exe")) {
            throw "dist/ygo-effect-dsl-desktop.exe was not created"
          }

      - name: Smoke test packaged CLI executable
        run: |
          .\dist\ygo-effect-dsl.exe --version
          .\dist\ygo-effect-dsl.exe ingest --dataset examples/sample_dataset
          .\dist\ygo-effect-dsl.exe validate-dict
          .\dist\ygo-effect-dsl.exe transform --dataset examples/sample_dataset --out data/exe_smoke
          .\dist\ygo-effect-dsl.exe validate data/exe_smoke/yaml
          .\dist\ygo-effect-dsl.exe validate-route examples/route_dsl/minimal_route.yaml
          .\dist\ygo-effect-dsl.exe experiment-search --help
          .\dist\ygo-effect-dsl.exe job-inspect --help

      - name: Smoke test packaged desktop executable
        run: |
          .\dist\ygo-effect-dsl-desktop.exe --version
          .\dist\ygo-effect-dsl-desktop.exe --preflight-only --diagnostics-out desktop-preflight.json
          .\dist\ygo-effect-dsl-desktop.exe --bridge-smoke-out desktop-bridge-smoke.json

      - name: Verify unsigned Authenticode artifacts are not release eligible
        shell: pwsh
        run: |
          $results = foreach ($artifact in @("dist\ygo-effect-dsl.exe", "dist\ygo-effect-dsl-desktop.exe")) {
            $signature = Get-AuthenticodeSignature $artifact
            if ($signature.Status -eq "Valid") {
              throw "Unsigned CI path unexpectedly produced a valid Authenticode signature for $artifact"
            }
            [PSCustomObject]@{
              artifact = $artifact
              release_eligible = $false
              rejection = "unsigned_or_untrusted_signature"
              signature_status = [string]$signature.Status
            }
          }
          $results | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 unsigned-authenticode-verification.json

      - name: Build portable Windows package
        run: |
          New-Item -ItemType Directory -Force package\ygo-effect-dsl-win64
          Copy-Item dist\ygo-effect-dsl.exe package\ygo-effect-dsl-win64\ygo-effect-dsl.exe
          Copy-Item dist\ygo-effect-dsl-desktop.exe package\ygo-effect-dsl-win64\ygo-effect-dsl-desktop.exe
          Copy-Item packaging/windows-portable/README.txt package\ygo-effect-dsl-win64\README.txt
          Copy-Item docs/release/evidence/v1_0_0_third_party_notices.md package\ygo-effect-dsl-win64\THIRD_PARTY_NOTICES.md
          Copy-Item docs/legal/10_distribution_policy.md package\ygo-effect-dsl-win64\DISTRIBUTION_POLICY.md
          Compress-Archive -Path package\ygo-effect-dsl-win64 -DestinationPath ygo-effect-dsl-win64-portable.zip -Force

      - name: Smoke test portable Windows package
        run: |
          Expand-Archive ygo-effect-dsl-win64-portable.zip -DestinationPath package_smoke -Force
          .\package_smoke\ygo-effect-dsl-win64\ygo-effect-dsl.exe --version
          .\package_smoke\ygo-effect-dsl-win64\ygo-effect-dsl-desktop.exe --version
          .\package_smoke\ygo-effect-dsl-win64\ygo-effect-dsl-desktop.exe --preflight-only --diagnostics-out package-desktop-preflight.json
          .\package_smoke\ygo-effect-dsl-win64\ygo-effect-dsl-desktop.exe --bridge-smoke-out package-desktop-bridge-smoke.json

      - name: Upload executable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ygo-effect-dsl-win64
          path: |
            dist/ygo-effect-dsl.exe
            dist/ygo-effect-dsl-desktop.exe
            ygo-effect-dsl-win64-portable.zip
            desktop-preflight.json
            desktop-bridge-smoke.json
            unsigned-authenticode-verification.json
            package-desktop-preflight.json
            package-desktop-bridge-smoke.json
          if-no-files-found: error
